name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Covers the engine layer: BVH raycasts, navmesh pathing, Rapier physics
      # and character motor, the fixed-timestep accumulator, audio voice limits,
      # and the co-op transport (host migration, addressing, room isolation).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 7

  assets:
    name: asset budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Reports how much dead weight the shipped GLBs are still carrying.
      # Non-blocking: models are not always present in a checkout.
      - name: GLB size report
        run: npm run assets:check || true
